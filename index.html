<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Hikaproj Launcher - Your Personal Start Page</title>
    <meta name="description" content="検索、ブックマーク、RSS、AI チャットを統合したカスタマイズ可能なホームランチャー。PWA 対応でオフライン利用も可能。">
    <meta name="keywords" content="ランチャー，スタートページ，検索，ブックマーク，RSS,AI,PWA，気象庁，Gemini,OpenAI">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#4f46e5">
    <meta name="author" content="Hikaproj">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hikaproj.github.io/launcher/">
    <meta property="og:title" content="Hikaproj Launcher - Your Personal Start Page">
    <meta property="og:description" content="検索、ブックマーク、RSS、AI チャットを統合したカスタマイズ可能なホームランチャー。">
    <meta property="og:image" content="https://hikaproj.github.io/launcher/og-image.png">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://hikaproj.github.io/launcher/">
    <meta name="twitter:title" content="Hikaproj Launcher - Your Personal Start Page">
    <meta name="twitter:description" content="検索、ブックマーク、RSS、AI チャットを統合したカスタマイズ可能なホームランチャー。">
    <meta name="twitter:image" content="https://hikaproj.github.io/launcher/og-image.png">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://hikaproj.github.io/launcher/">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hikaproj Launcher">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#7c3aed'
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Highlight.js for code highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Hikaproj Launcher",
        "url": "https://hikaproj.github.io/launcher/",
        "description": "検索、ブックマーク、RSS、AI チャットを統合したカスタマイズ可能なホームランチャー。",
        "applicationCategory": "Productivity",
        "operatingSystem": "Any",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "JPY"
        },
        "featureList": "Search, Bookmarks, RSS Reader, AI Chat, Weather, PWA"
    }
    </script>
    
    <style>
        body { transition: background 0.3s ease; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dark .glass-effect {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bookmark-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.3); border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.5); }
        .dragging { opacity: 0.5; transform: scale(1.05); }
        @keyframes pulse-dot { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .typing-indicator span { animation: pulse-dot 1.4s infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        .draggable-item { cursor: grab; }
        .draggable-item:active { cursor: grabbing; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-800 text-gray-800 dark:text-gray-100 overflow-x-hidden">
    
    <div id="background-layer" class="fixed inset-0 z-0 pointer-events-none"></div>
    
    <div class="relative z-10 container mx-auto px-4 py-8 max-w-7xl">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center space-x-3">
                <i class="fas fa-rocket text-3xl text-primary"></i>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">Hikaproj Launcher</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-white/20 transition-colors">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block"></i>
                </button>
                <button id="settings-btn" class="p-2 rounded-full hover:bg-white/20 transition-colors">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>
        
        <!-- Search Section -->
        <section id="search-section" class="mb-8">
            <div class="glass-effect rounded-2xl p-6 max-w-3xl mx-auto">
                <div class="flex items-center space-x-4 mb-4">
                    <select id="search-engine" class="bg-white/10 dark:bg-black/20 border border-white/20 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="google">Google</option>
                        <option value="bing">Bing</option>
                        <option value="duckduckgo">DuckDuckGo</option>
                        <option value="brave">Brave</option>
                        <option value="yahoo">Yahoo! JAPAN</option>
                    </select>
                </div>
                <div class="relative">
                    <input type="text" id="search-input" placeholder="検索..." 
                           class="w-full bg-white/20 dark:bg-black/30 border border-white/30 rounded-xl px-4 py-3 pl-12 focus:outline-none focus:ring-2 focus:ring-primary text-lg">
                    <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <button id="search-btn" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-primary hover:bg-primary/80 text-white rounded-lg px-4 py-2 transition-colors">
                        検索
                    </button>
                </div>
                <div id="search-history" class="mt-2 flex flex-wrap gap-2"></div>
            </div>
        </section>
        
        <!-- Greeting & Weather -->
        <section id="greeting-section" class="mb-8">
            <div class="glass-effect rounded-2xl p-6 max-w-3xl mx-auto">
                <div class="flex justify-between items-center flex-wrap gap-4">
                    <div>
                        <h2 id="greeting-text" class="text-xl font-semibold mb-1"></h2>
                        <p id="datetime-text" class="text-gray-600 dark:text-gray-400"></p>
                    </div>
                    <div id="weather-widget" class="flex items-center space-x-3 bg-white/10 dark:bg-black/20 rounded-xl px-4 py-2">
                        <i class="fas fa-cloud text-2xl text-blue-400"></i>
                        <div>
                            <p id="weather-temp" class="font-bold">--°C</p>
                            <p id="weather-desc" class="text-sm text-gray-600 dark:text-gray-400">--</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- Bookmarks Section -->
        <section id="bookmarks-section" class="mb-8">
            <div class="glass-effect rounded-2xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold"><i class="fas fa-bookmark mr-2"></i>ブックマーク</h3>
                    <div class="flex items-center space-x-2">
                        <input type="text" id="bookmark-search" placeholder="ブックマーク検索..." 
                               class="bg-white/10 dark:bg-black/20 border border-white/20 rounded-lg px-3 py-1 text-sm focus:outline-none">
                        <button id="add-bookmark-btn" class="bg-primary hover:bg-primary/80 text-white rounded-lg px-3 py-1 text-sm transition-colors">
                            <i class="fas fa-plus mr-1"></i>追加
                        </button>
                    </div>
                </div>
                <div id="bookmarks-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                </div>
            </div>
        </section>
        
        <!-- RSS Section -->
        <section id="rss-section" class="mb-8">
            <div class="glass-effect rounded-2xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold"><i class="fas fa-rss mr-2"></i>ニュース</h3>
                    <button id="manage-rss-btn" class="bg-primary hover:bg-primary/80 text-white rounded-lg px-3 py-1 text-sm transition-colors">
                        <i class="fas fa-cog mr-1"></i>管理
                    </button>
                </div>
                <div id="rss-tabs" class="flex flex-wrap gap-2 mb-4"></div>
                <div id="rss-content" class="space-y-3 max-h-96 overflow-y-auto scrollbar-thin">
                </div>
            </div>
        </section>
        
        <!-- AI Chat Section -->
        <section id="ai-section" class="mb-8">
            <div class="glass-effect rounded-2xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold"><i class="fas fa-robot mr-2"></i>AI チャット</h3>
                    <div class="flex items-center space-x-2">
                        <select id="ai-model-select" class="bg-white/10 dark:bg-black/20 border border-white/20 rounded-lg px-3 py-1 text-sm focus:outline-none">
                        </select>
                        <button id="new-chat-btn" class="bg-secondary hover:bg-secondary/80 text-white rounded-lg px-3 py-1 text-sm transition-colors">
                            <i class="fas fa-plus mr-1"></i>新規
                        </button>
                    </div>
                </div>
                <div id="chat-messages" class="h-96 overflow-y-auto scrollbar-thin mb-4 space-y-3 p-4 bg-white/5 dark:bg-black/20 rounded-xl">
                    <div class="text-center text-gray-500 dark:text-gray-400 mt-20">
                        <i class="fas fa-comments text-4xl mb-2"></i>
                        <p>AI チャットを開始するには、メッセージを入力してください</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <textarea id="chat-input" placeholder="メッセージを入力..." rows="2"
                              class="flex-1 bg-white/20 dark:bg-black/30 border border-white/30 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary resize-none"></textarea>
                    <button id="chat-send-btn" class="bg-primary hover:bg-primary/80 text-white rounded-xl px-4 py-2 transition-colors">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </section>
        
    </div>
    
    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeSettingsModal()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-4xl max-h-[80vh] overflow-y-auto bg-white dark:bg-gray-800 rounded-2xl shadow-2xl">
            <div class="sticky top-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-4 flex justify-between items-center">
                <h2 class="text-xl font-bold">設定</h2>
                <button onclick="closeSettingsModal()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 space-y-6">
                
                <!-- Visibility Settings -->
                <div class="border-b border-gray-200 dark:border-gray-700 pb-4">
                    <h3 class="text-lg font-semibold mb-3">表示設定</h3>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="vis-search" class="rounded text-primary focus:ring-primary">
                            <span>検索</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="vis-bookmarks" class="rounded text-primary focus:ring-primary">
                            <span>ブックマーク</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="vis-rss" class="rounded text-primary focus:ring-primary">
                            <span>RSS</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="vis-weather" class="rounded text-primary focus:ring-primary">
                            <span>天気</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="vis-ai" class="rounded text-primary focus:ring-primary">
                            <span>AI チャット</span>
                        </label>
                    </div>
                </div>
                
                <!-- Background Settings -->
                <div class="border-b border-gray-200 dark:border-gray-700 pb-4">
                    <h3 class="text-lg font-semibold mb-3">背景設定</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm font-medium mb-1">画像 URL</label>
                            <input type="text" id="bg-url" placeholder="https://example.com/image.jpg" 
                                   class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">画像をアップロード</label>
                            <input type="file" id="bg-file" accept="image/*" 
                                   class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-primary file:text-white hover:file:bg-primary/80">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">透明度：<span id="opacity-value">0.8</span></label>
                            <input type="range" id="bg-opacity" min="0" max="1" step="0.1" value="0.8" 
                                   class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">ぼかし：<span id="blur-value">5</span></label>
                            <input type="range" id="bg-blur" min="0" max="20" step="1" value="5" 
                                   class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>
                </div>
                
                <!-- Weather Settings -->
                <div class="border-b border-gray-200 dark:border-gray-700 pb-4">
                    <h3 class="text-lg font-semibold mb-3">天気設定</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm font-medium mb-1">提供元</label>
                            <select id="weather-provider" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                                <option value="openmeteo">Open-Meteo (全球)</option>
                                <option value="jma">気象庁 (日本)</option>
                            </select>
                        </div>
                        <div id="jma-location-setting" class="hidden">
                            <label class="block text-sm font-medium mb-1">地点コードまたは緯度経度</label>
                            <input type="text" id="jma-location" placeholder="例：130000 または 35.6895,139.6917" 
                                   class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                        </div>
                    </div>
                </div>
                
                <!-- AI Provider Settings -->
                <div class="border-b border-gray-200 dark:border-gray-700 pb-4">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-lg font-semibold">AI プロバイダ設定</h3>
                        <button id="add-provider-btn" class="bg-primary hover:bg-primary/80 text-white rounded-lg px-3 py-1 text-sm transition-colors">
                            <i class="fas fa-plus mr-1"></i>追加
                        </button>
                    </div>
                    <div id="providers-list" class="space-y-3"></div>
                </div>
                
                <!-- AI Model Settings -->
                <div class="border-b border-gray-200 dark:border-gray-700 pb-4">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-lg font-semibold">AI モデル設定</h3>
                        <button id="add-model-btn" class="bg-primary hover:bg-primary/80 text-white rounded-lg px-3 py-1 text-sm transition-colors">
                            <i class="fas fa-plus mr-1"></i>追加
                        </button>
                    </div>
                    <div id="models-list" class="space-y-3"></div>
                </div>
                
                <!-- RSS Settings -->
                <div class="border-b border-gray-200 dark:border-gray-700 pb-4">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-lg font-semibold">RSS フィード設定</h3>
                        <button id="add-rss-btn" class="bg-primary hover:bg-primary/80 text-white rounded-lg px-3 py-1 text-sm transition-colors">
                            <i class="fas fa-plus mr-1"></i>追加
                        </button>
                    </div>
                    <div id="rss-feeds-list" class="space-y-3"></div>
                </div>
                
                <!-- Data Management -->
                <div>
                    <h3 class="text-lg font-semibold mb-3">データ管理</h3>
                    <div class="space-y-3">
                        <div class="flex flex-wrap gap-2">
                            <button id="export-all-btn" class="bg-green-600 hover:bg-green-700 text-white rounded-lg px-4 py-2 transition-colors">
                                <i class="fas fa-download mr-1"></i>すべてエクスポート
                            </button>
                            <button id="export-selected-btn" class="bg-green-600 hover:bg-green-700 text-white rounded-lg px-4 py-2 transition-colors">
                                <i class="fas fa-download mr-1"></i>選択してエクスポート
                            </button>
                            <label class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2 cursor-pointer transition-colors">
                                <i class="fas fa-upload mr-1"></i>インポート
                                <input type="file" id="import-file" accept=".json" class="hidden">
                            </label>
                        </div>
                        <div id="export-options" class="hidden bg-gray-100 dark:bg-gray-700 rounded-lg p-3">
                            <p class="text-sm font-medium mb-2">エクスポート項目を選択:</p>
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" class="export-option" value="bookmarks" checked>
                                    <span>ブックマーク</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" class="export-option" value="rss" checked>
                                    <span>RSS</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" class="export-option" value="ai" checked>
                                    <span>AI 設定</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" class="export-option" value="background" checked>
                                    <span>背景</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" class="export-option" value="search" checked>
                                    <span>検索履歴</span>
                                </label>
                            </div>
                            <div class="mt-3 flex gap-2">
                                <button id="confirm-export-btn" class="bg-green-600 hover:bg-green-700 text-white rounded-lg px-4 py-2 text-sm transition-colors">
                                    エクスポート実行
                                </button>
                                <button onclick="document.getElementById('export-options').classList.add('hidden')" class="bg-gray-500 hover:bg-gray-600 text-white rounded-lg px-4 py-2 text-sm transition-colors">
                                    キャンセル
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <label class="text-sm">インポートモード:</label>
                            <select id="import-mode" class="bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-1 text-sm">
                                <option value="overwrite">上書き</option>
                                <option value="merge">追加（マージ）</option>
                                <option value="keep">維持（不足のみ）</option>
                            </select>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
    
    <!-- Bookmark Add/Edit Modal -->
    <div id="bookmark-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeBookmarkModal()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6">
            <h3 class="text-xl font-bold mb-4" id="bookmark-modal-title">ブックマークを追加</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">名前</label>
                    <input type="text" id="bm-title" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">URL</label>
                    <input type="url" id="bm-url" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">カテゴリ</label>
                    <input type="text" id="bm-category" list="bm-categories" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                    <datalist id="bm-categories"></datalist>
                </div>
                <div class="flex justify-end space-x-2">
                    <button onclick="closeBookmarkModal()" class="bg-gray-500 hover:bg-gray-600 text-white rounded-lg px-4 py-2 transition-colors">キャンセル</button>
                    <button id="save-bookmark-btn" class="bg-primary hover:bg-primary/80 text-white rounded-lg px-4 py-2 transition-colors">保存</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- RSS Feed Modal -->
    <div id="rss-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeRssModal()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6">
            <h3 class="text-xl font-bold mb-4" id="rss-modal-title">RSS フィードを追加</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">名前</label>
                    <input type="text" id="rss-name" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">URL</label>
                    <input type="url" id="rss-url" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div class="flex justify-end space-x-2">
                    <button onclick="closeRssModal()" class="bg-gray-500 hover:bg-gray-600 text-white rounded-lg px-4 py-2 transition-colors">キャンセル</button>
                    <button id="save-rss-btn" class="bg-primary hover:bg-primary/80 text-white rounded-lg px-4 py-2 transition-colors">保存</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Provider Modal -->
    <div id="provider-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeProviderModal()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6">
            <h3 class="text-xl font-bold mb-4" id="provider-modal-title">プロバイダを追加</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">名前</label>
                    <input type="text" id="prov-name" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">タイプ</label>
                    <select id="prov-type" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="gemini">Google Gemini</option>
                        <option value="openai">OpenAI / 互換</option>
                        <option value="openrouter">OpenRouter</option>
                        <option value="groq">Groq</option>
                        <option value="opencode">OpenCode</option>
                        <option value="custom">カスタム</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Base URL</label>
                    <input type="text" id="prov-baseurl" placeholder="https://api.example.com/v1" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">API Key</label>
                    <input type="password" id="prov-apikey" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div class="flex justify-end space-x-2">
                    <button onclick="closeProviderModal()" class="bg-gray-500 hover:bg-gray-600 text-white rounded-lg px-4 py-2 transition-colors">キャンセル</button>
                    <button id="save-provider-btn" class="bg-primary hover:bg-primary/80 text-white rounded-lg px-4 py-2 transition-colors">保存</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Model Modal -->
    <div id="model-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeModelModal()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6">
            <h3 class="text-xl font-bold mb-4" id="model-modal-title">モデルを追加</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">表示名</label>
                    <input type="text" id="model-name" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">モデル ID</label>
                    <input type="text" id="model-id" placeholder="gpt-4o, gemini-1.5-pro, ..." class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">プロバイダ</label>
                    <select id="model-provider" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                    </select>
                </div>
                <div class="flex justify-end space-x-2">
                    <button onclick="closeModelModal()" class="bg-gray-500 hover:bg-gray-600 text-white rounded-lg px-4 py-2 transition-colors">キャンセル</button>
                    <button id="save-model-btn" class="bg-primary hover:bg-primary/80 text-white rounded-lg px-4 py-2 transition-colors">保存</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/app.js"></script>
</body>
</html>
